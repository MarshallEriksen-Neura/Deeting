name: Release Main

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0-2)"
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  PROTOC_VERSION: "33.4"

jobs:
  build-main:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app"
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app"
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: "--bundles nsis,msi"
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_DESKTOP_EXTERNAL_LOGIN_URL: ${{ vars.NEXT_PUBLIC_DESKTOP_EXTERNAL_LOGIN_URL || secrets.NEXT_PUBLIC_DESKTOP_EXTERNAL_LOGIN_URL }}
      NEXT_PUBLIC_IS_TAURI: ${{ vars.NEXT_PUBLIC_IS_TAURI || secrets.NEXT_PUBLIC_IS_TAURI }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate release tag matches bundled versions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          release_tag = "${{ env.RELEASE_TAG }}"
          main_version = json.loads(Path("deeting/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))["version"]
          installer_version = json.loads(Path("installer/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))["version"]

          expected_tag = f"v{main_version}"
          if release_tag != expected_tag:
              raise SystemExit(
                  f"release tag {release_tag!r} does not match bundled app version {expected_tag!r}"
              )

          if installer_version != main_version:
              raise SystemExit(
                  "installer version does not match main app version: "
                  f"{installer_version!r} != {main_version!r}"
              )
          PY

      - name: Install Ubuntu system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Import Apple signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured, skipping code signing setup"
            exit 0
          fi
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - uses: oven-sh/setup-bun@v2

      - name: Validate desktop public build env
        shell: bash
        run: |
          missing=()
          for key in NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_DESKTOP_EXTERNAL_LOGIN_URL NEXT_PUBLIC_IS_TAURI; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required desktop build env: ${missing[*]}"
            echo "Configure them in GitHub Actions Variables or Secrets."
            exit 1
          fi

      - name: Install protoc
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: python .github/scripts/install_protoc.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "deeting/src-tauri -> target"
          shared-key: "tauri-${{ matrix.target }}"
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: deeting

      - name: Build and publish Windows main application
        if: matrix.platform == 'windows-latest'
        id: build_windows_release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTC_WRAPPER: sccache
        with:
          projectPath: deeting
          includeRelease: true
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Deeting ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          args: ${{ matrix.args }}

      - name: Build main application artifacts
        if: matrix.platform != 'windows-latest'
        id: build_main_artifacts
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTC_WRAPPER: sccache
        with:
          projectPath: deeting
          includeRelease: true
          args: ${{ matrix.args }}

      - name: Prepare main artifact list
        id: main_artifact_list
        shell: bash
        env:
          ARTIFACT_PATHS_JSON: ${{ matrix.platform == 'windows-latest' && steps.build_windows_release.outputs.artifactPaths || steps.build_main_artifacts.outputs.artifactPaths }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from pathlib import Path

          raw_artifact_paths = os.environ.get("ARTIFACT_PATHS_JSON", "").strip()
          if not raw_artifact_paths:
              raise SystemExit(
                  "tauri-action did not return artifactPaths; check whether release artifacts were built"
              )

          artifact_paths = json.loads(raw_artifact_paths)
          if not artifact_paths:
              raise SystemExit("tauri-action did not return any artifact paths")

          file_artifact_paths = []
          skipped_directory_paths = []
          for artifact_path in artifact_paths:
              path = Path(artifact_path)
              if not path.exists():
                  raise SystemExit(f"tauri-action returned missing artifact path: {artifact_path}")
              if path.is_dir():
                  skipped_directory_paths.append(artifact_path)
                  continue
              file_artifact_paths.append(artifact_path)

          if not file_artifact_paths:
              raise SystemExit("tauri-action did not return any file artifact paths")

          if skipped_directory_paths:
              print(
                  "Skipping directory artifact paths so release uploads only include final files:",
                  file=sys.stderr,
              )
              for artifact_path in skipped_directory_paths:
                  print(f"- {artifact_path}", file=sys.stderr)

          print("paths<<EOF")
          for path in file_artifact_paths:
              print(path)
          print("EOF")
          PY

      - name: Upload main application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: main-${{ matrix.target }}
          path: ${{ steps.main_artifact_list.outputs.paths }}
          if-no-files-found: error
          retention-days: 1

  publish-main-release:
    needs: build-main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ needs.build-main.result == 'success' }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v6

      - name: Download main application artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: main-*
          path: ./release-assets

      - name: Inspect downloaded release assets
        shell: bash
        run: find ./release-assets -type f | sort

      - name: Prepare final release upload directory
        id: final_release_assets
        shell: bash
        run: |
          mkdir -p ./release-upload
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import shutil
          import sys
          from pathlib import Path

          release_assets_dir = Path("release-assets")
          release_upload_dir = Path("release-upload")

          # Compound suffixes recognised as release assets (order matters: longest first).
          ALLOWED_SUFFIXES = (
              ".app.tar.gz.sig",
              ".app.tar.gz",
              ".appimage.sig",
              ".appimage",
              ".dmg.sig",
              ".dmg",
              ".deb.sig",
              ".deb",
              ".rpm.sig",
              ".rpm",
              ".msi.sig",
              ".msi",
              ".exe.sig",
              ".exe",
          )

          def is_release_asset(path: Path) -> bool:
              lower = path.name.lower()
              if lower == "latest.json":
                  return True
              return any(lower.endswith(s) for s in ALLOWED_SUFFIXES)

          def should_upload_asset(path: Path) -> bool:
              artifact_dir = path.relative_to(release_assets_dir).parts[0]
              return artifact_dir != "main-x86_64-pc-windows-msvc"

          def split_compound_ext(name: str) -> tuple[str, str]:
              """Split a filename into (stem, compound_extension).

              Example: 'deeting.app.tar.gz' -> ('deeting', '.app.tar.gz')
              """
              lower = name.lower()
              for suffix in ALLOWED_SUFFIXES:
                  if lower.endswith(suffix):
                      stem = name[: len(name) - len(suffix)]
                      ext = name[len(stem):]
                      return stem, ext
              return name, ""

          def arch_label_from_dir(dir_name: str) -> str:
              """Extract a short architecture label from an artifact directory name.

              'main-aarch64-apple-darwin' -> '_aarch64'
              'main-x86_64-apple-darwin'  -> '_x86_64'
              'main-x86_64-unknown-linux-gnu' -> '_x86_64'
              """
              target = dir_name.removeprefix("main-")
              m = re.match(r"(aarch64|x86_64|i686|arm\w*)", target)
              return f"_{m.group(1)}" if m else f"_{target}"

          # Phase 1 — collect all release-worthy files, grouped by base filename.
          # Key: original basename, Value: list of source Paths.
          candidates: dict[str, list[Path]] = {}
          skipped_paths: list[Path] = []

          for path in sorted(release_assets_dir.rglob("*")):
              if not path.is_file():
                  continue
              if is_release_asset(path) and should_upload_asset(path):
                  candidates.setdefault(path.name, []).append(path)
              else:
                  skipped_paths.append(path)

          # Phase 2 — copy to release-upload, renaming when there are collisions.
          selected_paths: list[Path] = []

          for basename, sources in candidates.items():
              if len(sources) == 1:
                  # Unique filename — copy as-is.
                  dest = release_upload_dir / basename
                  shutil.copy2(sources[0], dest)
                  selected_paths.append(dest)
              else:
                  # Collision — add architecture suffix to every colliding file.
                  stem, ext = split_compound_ext(basename)
                  for src in sources:
                      # The artifact directory is named "main-{target}" (set by upload-artifact).
                      artifact_dir = src.relative_to(release_assets_dir).parts[0]
                      label = arch_label_from_dir(artifact_dir)
                      new_name = f"{stem}{label}{ext}"
                      dest = release_upload_dir / new_name
                      if dest.exists():
                          raise SystemExit(
                              f"duplicate release asset name even after arch rename: {new_name}"
                          )
                      shutil.copy2(src, dest)
                      selected_paths.append(dest)
                      print(f"Renamed {basename} -> {new_name} (from {artifact_dir})", file=sys.stderr)

          if not selected_paths:
              raise SystemExit("no final release assets matched the upload allowlist")

          print("Selected final release assets:", file=sys.stderr)
          for path in sorted(selected_paths):
              print(f"  {path.name}", file=sys.stderr)

          if skipped_paths:
              print("Skipped non-release files from downloaded artifacts:", file=sys.stderr)
              for path in skipped_paths:
                  print(f"  {path.as_posix()}", file=sys.stderr)

          print("paths<<EOF")
          for path in sorted(selected_paths):
              print(path.as_posix())
          print("EOF")
          PY

      - name: Inspect final release upload staging
        shell: bash
        run: find ./release-upload -maxdepth 1 -type f | sort

      - name: Prepare updater manifest asset directory
        shell: bash
        run: |
          mkdir -p ./release-manifest-assets
          cp -a ./release-upload/. ./release-manifest-assets/
          python - <<'PY'
          import shutil
          from pathlib import Path

          release_assets_dir = Path("release-assets")
          manifest_assets_dir = Path("release-manifest-assets")
          windows_assets_dir = release_assets_dir / "main-x86_64-pc-windows-msvc"

          if not windows_assets_dir.exists():
              raise SystemExit(
                  f"expected Windows artifact directory is missing: {windows_assets_dir}"
              )

          allowed_suffixes = (
              ".app.tar.gz.sig",
              ".app.tar.gz",
              ".appimage.sig",
              ".appimage",
              ".dmg.sig",
              ".dmg",
              ".deb.sig",
              ".deb",
              ".rpm.sig",
              ".rpm",
              ".msi.sig",
              ".msi",
              ".exe.sig",
              ".exe",
          )

          for path in sorted(windows_assets_dir.rglob("*")):
              if not path.is_file():
                  continue
              lower = path.name.lower()
              if lower != "latest.json" and not any(lower.endswith(suffix) for suffix in allowed_suffixes):
                  continue
              dest = manifest_assets_dir / path.name
              if dest.exists():
                  raise SystemExit(f"duplicate manifest asset name found: {dest.name}")
              shutil.copy2(path, dest)
          PY

      - name: Inspect updater manifest asset staging
        shell: bash
        run: find ./release-manifest-assets -maxdepth 1 -type f | sort

      - name: Remove leaked non-release assets from existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          release_tag = os.environ["RELEASE_TAG"]

          def is_release_asset(name: str) -> bool:
              lower = name.lower()
              if lower == "latest.json":
                  return True
              allowed_suffixes = (
                  ".app.tar.gz",
                  ".app.tar.gz.sig",
                  ".dmg",
                  ".dmg.sig",
                  ".deb",
                  ".deb.sig",
                  ".rpm",
                  ".rpm.sig",
                  ".msi",
                  ".msi.sig",
                  ".exe",
                  ".exe.sig",
                  ".appimage",
                  ".appimage.sig",
              )
              return any(lower.endswith(suffix) for suffix in allowed_suffixes)

          raw = subprocess.check_output(
              ["gh", "release", "view", release_tag, "--json", "assets"],
              text=True,
          )
          assets = json.loads(raw)["assets"]
          leaked_assets = [
              asset["name"]
              for asset in assets
              if not is_release_asset(asset["name"])
          ]

          if not leaked_assets:
              print("No leaked non-release assets found on the existing release.", file=sys.stderr)
              raise SystemExit(0)

          print("Deleting leaked non-release assets from the existing release:", file=sys.stderr)
          for asset_name in leaked_assets:
              print(f"- {asset_name}", file=sys.stderr)
              subprocess.run(
                  ["gh", "release", "delete-asset", release_tag, asset_name, "--yes"],
                  check=True,
              )
          PY

      - name: Upload final release assets
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.final_release_assets.outputs.paths }}
          draft: false
          prerelease: false

      - name: Read release metadata for updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --json body,publishedAt > ./release-metadata.json

      - name: Generate unified updater manifest
        shell: bash
        run: |
          python .github/scripts/generate_updater_manifest.py \
            --assets-dir ./release-manifest-assets \
            --repo "${{ github.repository }}" \
            --release-tag "$RELEASE_TAG" \
            --metadata-json ./release-metadata.json \
            --output ./release-upload/latest.json

      - name: Upload unified updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" ./release-upload/latest.json --clobber

  dispatch-installer-release:
    needs: [build-main, publish-main-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    if: ${{ needs.build-main.result == 'success' && needs.publish-main-release.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      SOURCE_REF: ${{ github.sha }}

    steps:
      - name: Trigger bootstrapper installer workflow
        run: |
          gh workflow run release-installer.yml \
            --repo "${{ github.repository }}" \
            -f release_tag="${RELEASE_TAG}" \
            -f source_ref="${SOURCE_REF}"
