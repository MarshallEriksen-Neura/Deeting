name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-main:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "tag_name must start with v and follow semver style, got: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Install Ubuntu system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Import Apple signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured, skipping code signing setup"
            exit 0
          fi
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - uses: oven-sh/setup-bun@v2

      - name: Setup protoc
        uses: arduino/setup-protoc@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'deeting/src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: deeting

      - name: Build main application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_IS_TAURI: 'true'
        with:
          projectPath: deeting
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Deeting ${{ env.RELEASE_TAG }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Upload Windows NSIS installer for later use
      - name: Upload Windows installer artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: |
            deeting/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  build-windows-installer:
    needs: build-main
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'installer/src-tauri -> target'

      # Download the main app's NSIS installer
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-installer
          path: ./main-installer

      # Prepare resources directory for installer
      - name: Prepare installer resources
        shell: bash
        run: |
          mkdir -p installer/src-tauri/resources
          cp main-installer/*.exe installer/src-tauri/resources/deeting-setup.exe
          ls -la installer/src-tauri/resources/

      - name: Install installer frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: installer

      - name: Build installer frontend
        run: bun run build
        working-directory: installer

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_IS_TAURI: 'true'
        with:
          projectPath: installer
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Deeting ${{ env.RELEASE_TAG }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: false
          args: ''

      # Rename installer to indicate it's the bootstrapper
      - name: Rename installer
        shell: bash
        run: |
          cd installer/src-tauri/target/release/bundle/nsis
          for file in *.exe; do
            if [[ "$file" != *"bootstrapper"* ]]; then
              mv "$file" "${file%.exe}-bootstrapper.exe"
            fi
          done
          ls -la

      - name: Upload bootstrapper installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-bootstrapper-installer
          path: installer/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  publish-final-release:
    needs: [build-main, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always()
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Download bootstrapper installer
        uses: actions/download-artifact@v4
        with:
          name: windows-bootstrapper-installer
          path: ./release-assets

      - name: Upload final release assets
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*.exe
          draft: false
          prerelease: false
