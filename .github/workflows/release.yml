name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0-2)"
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  PROTOC_VERSION: "33.4"

jobs:
  build-main:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app"
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app"
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm"
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: "--bundles nsis,msi"
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      SCOUT_SERVICE_URL: ${{ vars.SCOUT_SERVICE_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_DESKTOP_EXTERNAL_LOGIN_URL: ${{ vars.NEXT_PUBLIC_DESKTOP_EXTERNAL_LOGIN_URL }}
      NEXT_PUBLIC_IS_TAURI: ${{ vars.NEXT_PUBLIC_IS_TAURI }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate release tag matches bundled versions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          release_tag = "${{ env.RELEASE_TAG }}"
          main_version = json.loads(Path("deeting/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))["version"]
          installer_version = json.loads(Path("installer/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))["version"]

          expected_tag = f"v{main_version}"
          if release_tag != expected_tag:
              raise SystemExit(
                  f"release tag {release_tag!r} does not match bundled app version {expected_tag!r}"
              )

          if installer_version != main_version:
              raise SystemExit(
                  "installer version does not match main app version: "
                  f"{installer_version!r} != {main_version!r}"
              )
          PY

      - name: Install Ubuntu system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Import Apple signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured, skipping code signing setup"
            exit 0
          fi
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - uses: oven-sh/setup-bun@v2

      - name: Install protoc
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: python .github/scripts/install_protoc.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "deeting/src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: deeting

      - name: Build and publish Windows main application
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: deeting
          includeRelease: true
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Deeting ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Build main application artifacts
        if: matrix.platform != 'windows-latest'
        id: build_main_artifacts
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: deeting
          includeRelease: true
          args: ${{ matrix.args }}

      - name: Prepare main artifact list
        if: matrix.platform != 'windows-latest'
        id: main_artifact_list
        shell: bash
        env:
          ARTIFACT_PATHS_JSON: ${{ steps.build_main_artifacts.outputs.artifactPaths }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          raw_artifact_paths = os.environ.get("ARTIFACT_PATHS_JSON", "").strip()
          if not raw_artifact_paths:
              raise SystemExit(
                  "tauri-action did not return artifactPaths; check whether release artifacts were built"
              )

          artifact_paths = json.loads(raw_artifact_paths)
          if not artifact_paths:
              raise SystemExit("tauri-action did not return any artifact paths")

          print("paths<<EOF")
          for path in artifact_paths:
              print(path)
          print("EOF")
          PY

      - name: Upload main application artifacts
        if: matrix.platform != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: main-${{ matrix.target }}
          path: ${{ steps.main_artifact_list.outputs.paths }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows installer artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: |
            deeting/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  build-windows-installer:
    needs: build-main
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "installer/src-tauri -> target"

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-installer
          path: ./main-installer

      - name: Prepare installer resources
        shell: bash
        run: |
          mkdir -p installer/src-tauri/resources
          cp main-installer/*.exe installer/src-tauri/resources/deeting-setup.exe
          ls -la installer/src-tauri/resources/

      - name: Install installer frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: installer

      - name: Build installer frontend
        run: bun run build
        working-directory: installer

      - name: Build installer
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_IS_TAURI: "true"
        with:
          projectPath: installer
          includeRelease: true
          args: ""

      - name: Rename installer
        shell: bash
        run: |
          cd installer/src-tauri/target/release/bundle/nsis
          for file in *.exe; do
            if [[ "$file" != *"bootstrapper"* ]]; then
              mv "$file" "${file%.exe}-bootstrapper.exe"
            fi
          done
          ls -la

      - name: Upload bootstrapper installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-bootstrapper-installer
          path: installer/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  publish-final-release:
    needs: [build-main, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ needs.build-main.result == 'success' && needs.build-windows-installer.result == 'success' }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v6

      - name: Download main application artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: main-*
          path: ./release-assets

      - name: Download bootstrapper installer
        uses: actions/download-artifact@v4
        with:
          name: windows-bootstrapper-installer
          path: ./release-assets

      - name: Inspect release asset staging
        shell: bash
        run: find ./release-assets -type f | sort

      - name: Upload final release assets
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release-assets/**/*
          draft: false
          prerelease: false
