[package]
name = "deeting-installer"
version = "0.1.0-9"
description = "Deeting Modern Installer"
authors = ["Deeting Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
zip = "2"
tempfile = "3"
winreg = "0.55"
dirs = "6"
