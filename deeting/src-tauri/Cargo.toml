[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
axum = "0.7"
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.5.5"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
thiserror = "1.0"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
keyring = "3.6.3"
lancedb = "0.26"
arrow-array = "57"
arrow-schema = "57"
handlebars = "6.3.2"
async-stream = "0.3.6"
async-trait = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
rmcp = { version = "1.1.1", features = ["client", "transport-streamable-http-client-reqwest", "reqwest", "transport-child-process"] }
