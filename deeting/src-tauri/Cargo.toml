[package]
name = "deeting"
version = "0.1.3-2"
description = "Deeting - AI-powered meeting assistant"
authors = ["Deeting Team"]
license = "MIT"
repository = "https://github.com/MarshallEriksen-Neura/Deeting"
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = [
  "crates/multi-agent-core",
  "crates/desktop-runtime-core",
  "crates/mcp-core",
  "crates/mcp-registry",
  "crates/mcp-runtime",
  "crates/mcp-storage",
  "crates/mcp-transport",
  "crates/mcp-session",
  "crates/mcp-facade",
]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
release-devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
multi-agent-core = { path = "crates/multi-agent-core" }
desktop-runtime-core = { path = "crates/desktop-runtime-core" }
mcp-core = { path = "crates/mcp-core" }
mcp-facade = { path = "crates/mcp-facade" }
mcp-registry = { path = "crates/mcp-registry" }
mcp-runtime = { path = "crates/mcp-runtime" }
mcp-storage = { path = "crates/mcp-storage" }
mcp-transport = { path = "crates/mcp-transport" }
mcp-session = { path = "crates/mcp-session" }
boxlite-sidecar-protocol = { path = "crates/boxlite-sidecar-protocol" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
axum = "0.7"
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2.5.5", default-features = false, features = ["rustls-tls-native-roots", "http2", "charset", "cookies", "macos-system-configuration", "socks"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
notify = "6.1.1"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
thiserror = "1.0"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
keyring = "3.6.3"
lancedb = "0.26"
arrow-array = "57"
arrow-schema = "57"
handlebars = "6.3.2"
async-stream = "0.3.6"
async-trait = "0.1"
prost = "0.13"
tower-http = { version = "0.6", features = ["cors"] }
rmcp = { version = "1.1.1", features = ["client", "transport-streamable-http-client-reqwest", "reqwest", "transport-child-process"] }
toml = "0.8"
dirs = "5.0"
qrcodegen = "1.8"
encoding_rs = "0.8"
rand_distr = "0.4"
# Office file generation
zip = "0.6"
# Cross-platform PTY for the terminal panel (uses ConPTY on Windows,
# native PTY on Unix). Spawns and manages user shell sessions.
portable-pty = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
atspi-common = "0.13.0"
atspi-connection = { version = "0.13.0", default-features = false }
atspi-proxies = { version = "0.13.0", default-features = false }
