[package]
name = "mcp-facade"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = "0.4"
mcp-core = { path = "../mcp-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
