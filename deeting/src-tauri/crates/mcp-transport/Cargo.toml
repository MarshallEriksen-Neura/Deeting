[package]
name = "mcp-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "1.1.1", features = ["client", "transport-streamable-http-client-reqwest", "reqwest", "transport-child-process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9.5" }
tokio = { version = "1", features = ["process", "io-util", "sync"] }
