# Shell Executor 配置示例
# 
# 这是一个示例配置文件,展示所有可配置选项。
# 实际使用时,请将此文件复制到配置目录:
# 
# Windows: %APPDATA%\deeting\shell_executor.toml
# Linux/macOS: ~/.config/deeting/shell_executor.toml
# 
# 如果配置文件不存在,将使用默认配置。

[executor]
# 默认超时时间(秒)
default_timeout_seconds = 300

# 最大超时时间(秒)
max_timeout_seconds = 1800

# 最大并发执行数
max_concurrent_executions = 10

[policy]
# 白名单 - 这些命令自动批准,无需用户确认
# 支持完全匹配和前缀匹配
whitelist = [
    "git status",         # 查看状态
    "git log",            # 查看日志
    "git diff",           # 查看差异
    "git branch",         # 查看分支
    "ls",                 # 列出文件
    "dir",                # 列出文件 (Windows)
    "cat",                # 查看文件
    "pwd",                # 显示当前目录
    "echo",               # 输出文本
    "node --version",     # 查看 Node 版本
    "npm --version",      # 查看 NPM 版本
    "python --version",   # 查看 Python 版本
]

# 黑名单模式 - 这些命令直接拒绝,不会执行
# 使用子串匹配
blacklist_patterns = [
    "rm -rf /",           # 删除根目录
    "rm -rf /*",          # 删除根目录所有文件
    "del /s /q C:\\",     # Windows 删除 C 盘
    "curl | bash",        # 远程脚本执行
    "wget | sh",          # 远程脚本执行
    ":(){ :|:& };:",      # Fork bomb
]

# 危险模式 - 这些命令需要用户明确批准
# 使用子串匹配
dangerous_patterns = [
    "rm -rf",             # 强制删除
    "sudo",               # 管理员权限
    "chmod 777",          # 危险权限
    "mkfs",               # 格式化
    "dd if=",             # 磁盘写入
    "> /dev/sd",          # 写入磁盘设备
]

[path_restrictions]
# 允许访问的路径
# 支持环境变量: $HOME, ~, $APP_DATA
allowed_paths = [
    "$HOME",              # 用户主目录
    "$HOME/Documents",    # 文档目录
    "$HOME/Desktop",      # 桌面
    "$HOME/Projects",     # 项目目录
    "$HOME/workspace",    # 工作空间
]

# 禁止访问的路径
# 即使在 allowed_paths 中,这些路径也会被拒绝
forbidden_paths = [
    "/etc",               # 系统配置
    "/usr",               # 系统程序
    "/bin",               # 系统命令
    "/sbin",              # 系统命令
    "C:\\Windows",        # Windows 系统目录
    "C:\\Program Files",  # Windows 程序目录
    "C:\\Program Files (x86)", # Windows 32位程序目录
]

[approval]
# 白名单命令是否自动批准
# true: 白名单命令直接执行,无需确认
# false: 所有命令都需要确认
auto_approve_whitelist = true

# 危险命令是否需要额外确认
# true: 危险命令需要用户明确批准
# false: 危险命令会被拒绝
require_confirmation_dangerous = true

# 审批缓存有效期(秒)
# 在有效期内,相同的命令不需要再次审批
cache_ttl_seconds = 3600  # 1小时

[audit]
# 是否启用审计日志
enabled = true

# 日志文件路径
# 支持环境变量: $APP_DATA, $HOME, ~
log_file = "$APP_DATA/deeting/logs/shell_executor.log"

# 日志保留天数
retention_days = 30
