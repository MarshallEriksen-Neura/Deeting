version: "3.9"

services:
  deeting-relay:
    build: .
    container_name: deeting-relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # HTTP listen address inside container
      RELAY_HTTP_ADDR: ":8080"

      # Shared secret between desktop app and relay (X-Relay-Secret)
      RELAY_SHARED_SECRET: "change-me-strong-secret"

      # Feishu callback signature secret (must match Feishu console)
      FEISHU_CALLBACK_SECRET: "your-feishu-callback-secret"

      # Feishu app credentials for sending messages
      FEISHU_BOT_APP_ID: "cli_xxx"
      FEISHU_BOT_APP_SECRET: "xxx"

