    <text x="636" y="228" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">3. 上下文沉淀</text>
    <text x="636" y="264" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">知识文档</text>
    <text x="636" y="292" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">记忆事实 / 检索</text>
