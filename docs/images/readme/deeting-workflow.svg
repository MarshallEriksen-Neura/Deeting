    <text x="354" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">语义路由</text>
    <text x="354" y="264" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">Assistant / Skills</text>
    <text x="354" y="292" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">桌面执行与工具调用</text>
    <circle cx="518" cy="258" r="42" fill="#8B5CF6" fill-opacity="0.24"/>
