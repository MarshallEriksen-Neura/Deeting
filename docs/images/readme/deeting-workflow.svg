    <text x="906" y="264" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">通知、IM、后续动作</text>
    <text x="906" y="292" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">让结果继续前进</text>
