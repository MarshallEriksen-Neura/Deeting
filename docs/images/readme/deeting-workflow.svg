<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="workflowBg" x1="72" y1="52" x2="1105" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#131F37"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="190" y1="258" x2="1012" y2="258" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#workflowBg)"/>
  <text x="76" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">从一句话，到一条不断线的执行闭环</text>
  <text x="76" y="126" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">自然语言指令不应该止步于“回答你”，还应该继续流向执行、记忆、知识与通知。</text>

  <path d="M188 258H1012" stroke="url(#flowLine)" stroke-width="8" stroke-linecap="round"/>

  <g>
