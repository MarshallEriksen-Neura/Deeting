    <text x="112" y="264" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">聊天、快捷触发</text>
    <text x="112" y="292" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">IM 协同、定时任务</text>
