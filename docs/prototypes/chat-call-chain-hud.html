<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调用链固定方案对比</title>
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --border: rgba(0,0,0,0.08);
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --accent: #6366f1;
    --accent-soft: rgba(99,102,241,0.12);
    --hud-bg: rgba(255,255,255,0.75);
    --msg-user: #6366f1;
    --msg-ai: #ffffff;
    --msg-ai-border: rgba(0,0,0,0.08);
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 12px;
    --running: #f59e0b;
    --done: #10b981;
    --waiting: #9ca3af;
  }
  [data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-2: #13151f;
    --border: rgba(255,255,255,0.08);
    --text: #e8eaf0;
    --text-muted: #6b7280;
    --hud-bg: rgba(26,29,39,0.85);
    --msg-user: #6366f1;
    --msg-ai: #1e2130;
    --msg-ai-border: rgba(255,255,255,0.06);
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .topbar h1 { font-size: 15px; font-weight: 600; }
  .theme-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .theme-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* Layout */
  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 53px);
  }

  /* Panel */
  .panel {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .panel-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 8px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .panel-label span { color: var(--accent); }

  /* HUD capsule */
  .hud {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--hud-bg);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .hud-model {
    font-size: 11px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid rgba(99,102,241,0.2);
  }
  .hud-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Call chain */
  .call-chain {
    padding: 10px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .call-chain-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .chain-steps { position: relative; padding-left: 16px; }
  .chain-steps::before {
    content: '';
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--border);
  }
  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    font-size: 12px;
    color: var(--text-muted);
  }
  .step.done { color: var(--text); }
  .step.running { color: var(--text); }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: -16px;
    position: relative;
    z-index: 1;
  }
  .dot.done { background: var(--done); }
  .dot.running {
    background: var(--running);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dot.waiting { background: var(--waiting); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
    50% { box-shadow: 0 0 0 4px rgba(245,158,11,0); }
  }
  .step-text { flex: 1; }
  .step-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 500;
  }
  .step-badge.done { background: rgba(16,185,129,0.12); color: var(--done); }
  .step-badge.running { background: rgba(245,158,11,0.12); color: var(--running); }
  .step-badge.waiting { background: rgba(156,163,175,0.12); color: var(--waiting); }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: var(--msg-user);
    color: white;
    border-radius: 10px 10px 2px 10px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--msg-ai);
    border: 1px solid var(--msg-ai-border);
    border-radius: 2px 10px 10px 10px;
    box-shadow: var(--shadow);
  }

  /* Call chain embedded in AI bubble (left panel) */
  .msg-call-chain {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .msg-call-chain .call-chain-title { margin-bottom: 6px; }

  /* Bottom bar */
  .bottom-bar {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .add-btn {
    flex: 1;
    padding: 7px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .add-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* Right panel: call chain is sticky below HUD */
  #right .call-chain {
    /* sticky is handled by flex-shrink:0 — it never scrolls since it's outside .messages */
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>调用链固定方案对比</h1>
  <button class="theme-btn" onclick="toggleTheme()">🌙 切换暗黑模式</button>
</div>

<div class="cols">
  <!-- LEFT: current design -->
  <div class="panel" id="left">
    <div class="panel-label">当前设计 — <span>调用链在消息流内，随消息被顶走</span></div>
    <div class="hud">
      <span class="hud-model">claude-opus-4</span>
      <span class="hud-title">分析用户行为数据报告</span>
    </div>
    <div class="messages" id="left-msgs">
      <div class="msg user">帮我分析这份用户行为数据，找出主要流失节点</div>
      <div class="msg ai">
        好的，我来分析这份数据。
        <div class="msg-call-chain">
          <div class="call-chain-title">调用链</div>
          <div class="chain-steps" id="left-chain">
            <div class="step done"><span class="dot done"></span><span class="step-text">读取数据文件</span><span class="step-badge done">完成</span></div>
            <div class="step done"><span class="dot done"></span><span class="step-text">统计各步骤转化率</span><span class="step-badge done">完成</span></div>
            <div class="step running"><span class="dot running"></span><span class="step-text">识别异常流失节点</span><span class="step-badge running">运行中</span></div>
            <div class="step waiting"><span class="dot waiting"></span><span class="step-text">生成可视化报告</span><span class="step-badge waiting">等待中</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom-bar">
      <button class="add-btn" onclick="addMessages('left')">+ 添加消息（调用链会被顶走）</button>
    </div>
  </div>

  <!-- RIGHT: improved design -->
  <div class="panel" id="right">
    <div class="panel-label">改进方案 — <span>调用链固定在顶部，始终可见</span></div>
    <div class="hud">
      <span class="hud-model">claude-opus-4</span>
      <span class="hud-title">分析用户行为数据报告</span>
    </div>
    <!-- Call chain is OUTSIDE messages scroll area -->
    <div class="call-chain">
      <div class="call-chain-title">调用链</div>
      <div class="chain-steps" id="right-chain">
        <div class="step done"><span class="dot done"></span><span class="step-text">读取数据文件</span><span class="step-badge done">完成</span></div>
        <div class="step done"><span class="dot done"></span><span class="step-text">统计各步骤转化率</span><span class="step-badge done">完成</span></div>
        <div class="step running"><span class="dot running"></span><span class="step-text">识别异常流失节点</span><span class="step-badge running">运行中</span></div>
        <div class="step waiting"><span class="dot waiting"></span><span class="step-text">生成可视化报告</span><span class="step-badge waiting">等待中</span></div>
      </div>
    </div>
    <div class="messages" id="right-msgs">
      <div class="msg user">帮我分析这份用户行为数据，找出主要流失节点</div>
      <div class="msg ai">好的，我来分析这份数据。结果稍后呈现。</div>
    </div>
    <div class="bottom-bar">
      <button class="add-btn" onclick="addMessages('right')">+ 添加消息（调用链始终可见）</button>
    </div>
  </div>
</div>

<script>
  const userLines = [
    '请继续，还需要分析第二季度的数据',
    '好的，那流失最严重的是哪个步骤？',
    '能给出改进建议吗？',
    '这个节点的具体数据是多少？',
    '和上个月相比有变化吗？'
  ];
  const aiLines = [
    '正在处理第二季度数据，请稍候…',
    '流失最严重的是"填写个人信息"步骤，流失率达到 47%。',
    '建议简化表单字段，将必填项从 12 个减少到 5 个。',
    '该节点日均 UV 8,200，完成率 53%，较行业基准低 18pp。',
    '与上月相比流失率上升 3.2pp，主要发生在移动端用户群。'
  ];
  let leftIdx = 0, rightIdx = 0;

  function addMessages(side) {
    const msgs = document.getElementById(side + '-msgs');
    const uIdx = (side === 'left' ? leftIdx : rightIdx) % userLines.length;
    const aIdx = uIdx;

    const u = document.createElement('div');
    u.className = 'msg user';
    u.textContent = userLines[uIdx];
    msgs.appendChild(u);

    const a = document.createElement('div');
    a.className = 'msg ai';
    a.textContent = aiLines[aIdx];
    msgs.appendChild(a);

    if (side === 'left') leftIdx++; else rightIdx++;
    msgs.scrollTop = msgs.scrollHeight;
  }

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
    document.querySelector('.theme-btn').textContent = isDark ? '🌙 切换暗黑模式' : '☀️ 切换白天模式';
  }
</script>
</body>
</html>
