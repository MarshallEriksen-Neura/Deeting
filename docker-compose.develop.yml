services:
  postgres:
    image: postgres:16-alpine
    container_name: apiproxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB not set}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apiproxy-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD not set}
    command:
      - sh
      - -c
      - |
        redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: apiproxy-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.12

  scout:
    build:
      context: ./scout
      dockerfile: Dockerfile
    image: deeting-scout:dev
    container_name: deeting-scout
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://:p4ssw0rd@apiproxy-redis:6379/1
      - QDRANT_URL=http://apiproxy-qdrant:6333
      - SCOUT_BROWSER_PROXY=${SCOUT_BROWSER_PROXY:-}
      - SCOUT_PAGE_TIMEOUT_MS=${SCOUT_PAGE_TIMEOUT_MS:-60000}
      - SCOUT_WAIT_UNTIL=${SCOUT_WAIT_UNTIL:-domcontentloaded}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8001:8001"
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.20

  api:
    build:
      context: ./deeting_core
      dockerfile: Dockerfile
    image: apiproxy-api:dev
    container_name: apiproxy-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AVATAR_LOCAL_DIR=/app/media/avatars
      - IMAGE_LOCAL_DIR=/app/media/images
    volumes:
      - ./security:/app/security:ro
      - ./deeting_core/logs:/app/logs
      - ./deeting_core/media:/app/media
      # 开发模式: 挂载源代码实现热重载（可选）
      - ./deeting_core/app:/app/app:ro
      - ./deeting_core/main.py:/app/main.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 开发模式:启用热重载
    command: sh -c "python -m app.scripts.env_check && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build:
      context: ./deeting_core
      dockerfile: Dockerfile
    image: apiproxy-api:dev
    container_name: apiproxy-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AVATAR_LOCAL_DIR=/app/media/avatars
      - IMAGE_LOCAL_DIR=/app/media/images
    volumes:
      - ./security:/app/security:ro
      - ./deeting_core/logs:/app/logs
      - ./deeting_core/media:/app/media
      - ./deeting_core/app:/app/app:ro
      - ./deeting_core/main.py:/app/main.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.14
    command: sh -c "python -m app.scripts.env_check && celery -A app.core.celery_app.celery_app worker -Q default,internal,billing,external,retry,conversation,image_generation,skill_registry,reasoning,notification,monitor_dlq -l info"

  celery_beat:
    build:
      context: ./deeting_core
      dockerfile: Dockerfile
    image: apiproxy-api:dev
    container_name: apiproxy-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AVATAR_LOCAL_DIR=/app/media/avatars
      - IMAGE_LOCAL_DIR=/app/media/images
    volumes:
      - ./security:/app/security:ro
      - ./deeting_core/logs:/app/logs
      - ./deeting_core/media:/app/media
      - ./deeting_core/app:/app/app:ro
      - ./deeting_core/main.py:/app/main.py:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.15
    command: sh -c "python -m app.scripts.env_check && celery -A app.core.celery_app.celery_app beat -l info"

  # 前端服务(开发环境,可选)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: apiproxy-frontend:dev
    container_name: apiproxy-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.13
    depends_on:
      - api

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: apiproxy-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=development
    ports:
      - "127.0.0.1:17700:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.16
    profiles:
      - optional

  opensandbox:
    image: ghcr.io/open-sandbox/opensandbox:latest
    container_name: apiproxy-opensandbox
    restart: unless-stopped
    environment:
      - SANDBOX_TOKEN=${SANDBOX_TOKEN:-sandboxToken}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      apiproxy-net:
        ipv4_address: 172.20.0.17
    profiles:
      - optional

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  meilisearch-data:

networks:
  apiproxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
