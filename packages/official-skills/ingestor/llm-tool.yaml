tools:
  - name: submit_assistant_ingest
    description: "Submit already-collected content for assistant ingest persistence. This tool does not fetch or search on your behalf."
    parameters:
      type: object
      properties:
        source_url: { type: string, description: "The original source URL." }
        content: { type: string, description: "Collected page or research content to persist for assistant ingest." }
        instruction: { type: string, description: "Custom guidance for the extraction." }
      required: ["source_url", "content"]
