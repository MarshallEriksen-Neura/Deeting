tools:
  - name: install_skill_from_git
    description: >
      [Deeting Platform] Install a skill by cloning a GitHub repository into
      the Deeting skills directory ($APP_DATA_DIR/skills/<skill_id>/).
      The repository MUST contain a deeting.json manifest, llm-tool.yaml, and
      main.py entry point. Do NOT install to ~/.config/opencode/, ~/.openclaw/,
      or any other platform's skill path.
    parameters:
      type: object
      properties:
        repo_url:
          type: string
          description: "HTTPS URL of the skill GitHub repository."
        skill_name:
          type: string
          description: "A short unique identifier for the skill (e.g., 'weather-tool')."
      required: ["repo_url", "skill_name"]

  - name: refresh_skill_index
    description: >
      [Deeting Platform] Rescan all local Deeting skill directories and
      rebuild the LanceDB semantic index. Call after installing or modifying skills.
    parameters: { type: object, properties: {} }

  - name: uninstall_skill
    description: >
      [Deeting Platform] Fully remove a locally installed skill from the
      Deeting skills directory, including its tools, embeddings, and files.
    parameters:
      type: object
      properties:
        skill_name:
          type: string
          description: "The skill_id to uninstall."
      required: ["skill_name"]
