tools:
  - name: find_skills
    description: >
      [Deeting Platform] Search the public skills ecosystem with
      `npx skills find <query>`. This wrapper is keyword-driven only; interactive
      picker mode is not supported from MCP tool execution.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "Keyword query, e.g. 'testing', 'nextjs', 'security'."
      required: ["query"]

  - name: add_skill
    description: >
      [Deeting Platform] Install skills from GitHub or another source using
      `npx skills add <package>`, then mirror the installed skill directory into
      Deeting's app-data skills path so the desktop runtime can discover and index it.
      If npx installation is unavailable or fails, fall back to git clone + local linking for repo-based packages.
    parameters:
      type: object
      properties:
        package:
          type: string
          description: "Package/repo/local path accepted by `npx skills add`."
        skill_names:
          type: array
          items: { type: string }
          description: "Optional list of specific skills to install from the package."
        install_all:
          type: boolean
          description: "Install all skills from the package into the managed global agent directory."

  - name: check_skill_updates
    description: >
      [Deeting Platform] Run `npx skills check` to inspect whether installed skills
      have updates available.
    parameters: { type: object, properties: {} }

  - name: update_skills
    description: >
      [Deeting Platform] Run `npx skills update`, then resync linked skill directories
      into Deeting's local app-data skills path and refresh the desktop index.
    parameters: { type: object, properties: {} }

  - name: inspect_skill_environment
    description: >
      [Deeting Platform] Check whether git/node/npx/python3 are available before
      attempting skill installation or update flows.
    parameters: { type: object, properties: {} }

  - name: refresh_skill_index
    description: >
      [Deeting Platform] Rescan all local Deeting skill directories and rebuild the
      semantic index. Call after manual skill file changes or sync repair.
    parameters: { type: object, properties: {} }

  - name: uninstall_skill
    description: >
      [Deeting Platform] Remove a skill from the managed global skills directory via
      `npx skills remove`, remove the Deeting local link, and refresh the desktop index.
    parameters:
      type: object
      properties:
        skill_name:
          type: string
          description: "Installed skill identifier to remove."
      required: ["skill_name"]
