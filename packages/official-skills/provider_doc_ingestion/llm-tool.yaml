tools:
  - name: collect_provider_doc_evidence
    description: "Fetch provider documentation pages and preserve source-linked evidence for later protocol extraction."
    parameters:
      type: object
      properties:
        urls:
          type: array
          items: { type: string }
        js_mode: { type: boolean, default: true }
      required: ["urls"]

  - name: draft_provider_candidate
    description: "Convert a structured provider extraction report into a provider preset candidate without publishing it."
    parameters:
      type: object
      properties:
        extraction_report: { type: object }
      required: ["extraction_report"]

  - name: score_provider_candidate_readiness
    description: "Score whether a provider preset candidate is ready for schema alignment and dry-run verification."
    parameters:
      type: object
      properties:
        candidate: { type: object }
      required: ["candidate"]

  - name: build_provider_registry_handoff
    description: "Build explicit get_unified_schema, verify_provider_template, and save_local_provider_preset payloads from a provider preset candidate."
    parameters:
      type: object
      properties:
        candidate: { type: object }
      required: ["candidate"]
