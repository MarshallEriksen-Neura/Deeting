tools:
  - name: list_provider_presets
    description: "List all available LLM provider templates."
    parameters: { type: object, properties: {} }

  - name: create_provider_preset
    description: "Create a new provider template."
    parameters:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        base_url: { type: string }
        auth_type: { type: string }
      required: ["name", "slug", "base_url", "auth_type"]
