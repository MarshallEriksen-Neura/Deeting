tools:
  - name: get_unified_schema
    description: "Get the desktop runtime's canonical request/response schema and protocol profile expectations for a capability."
    parameters:
      type: object
      properties:
        capability: { type: string }
      required: ["capability"]

  - name: verify_provider_template
    description: "Dry-run a desktop-local provider protocol profile or request template against a real provider API."
    parameters:
      type: object
      properties:
        capability: { type: string }
        base_url: { type: string }
        test_api_key: { type: string }
        protocol_family: { type: string }
        upstream_path: { type: string }
        template_engine: { type: string }
        request_template: { type: object }
        header_template: { type: object }
        query_template: { type: object }
        request_builder: { type: object }
        response_template: { type: object }
        output_mapping: { type: object }
        default_headers: { type: object }
        default_params: { type: object }
        test_payload: { type: object }
      required: ["base_url", "test_api_key", "request_template"]

  - name: save_provider_to_marketplace
    description: "Create or update a desktop-local provider preset so it appears in the local model service registry."
    parameters:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        provider: { type: string }
        base_url: { type: string }
        category: { type: string }
        url_template: { type: string }
        theme_color: { type: string }
        icon: { type: string }
        auth_type: { type: string }
        auth_config: { type: object }
        protocol_schema_version: { type: string }
        protocol_profiles: { type: object }
        version: { type: integer }
        is_active: { type: boolean }
      required: ["slug", "name", "provider", "base_url"]
