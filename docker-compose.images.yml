version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: apiproxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      POSTGRES_DB: ${POSTGRES_DB:-apiproxy}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apiproxy-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD not set}
    command: >
      sh -c "redis-server --requirepass \"$${REDIS_PASSWORD}\""
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: apiproxy-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: apiproxy-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY not set}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    ports:
      - "127.0.0.1:17700:7700"
    volumes:
      - meilisearch-data:/meili_data
    profiles:
      - optional

  opensandbox:
    image: ghcr.io/open-sandbox/opensandbox:latest
    container_name: apiproxy-opensandbox
    restart: unless-stopped
    environment:
      - SANDBOX_TOKEN=${SANDBOX_TOKEN:?SANDBOX_TOKEN not set}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - optional

  scout:
    image: marshalleriksen/deeting-scout:${IMAGE_TAG:-latest}
    container_name: deeting-scout
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@apiproxy-redis:6379/1
      - QDRANT_URL=http://apiproxy-qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8001:8001"

  api:
    image: marshalleriksen/apiproxy-api:${IMAGE_TAG:-latest}
    container_name: apiproxy-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/media:/app/backend/media
      - ./security:/app/security:ro
    command: sh -c "python -m app.scripts.env_check && uvicorn main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    image: marshalleriksen/apiproxy-api:${IMAGE_TAG:-latest}
    container_name: apiproxy-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/media:/app/backend/media
      - ./security:/app/security:ro
    command: sh -c "python -m app.scripts.env_check && celery -A app.celery_app.celery_app worker -l info"

  celery_beat:
    image: marshalleriksen/apiproxy-api:${IMAGE_TAG:-latest}
    container_name: apiproxy-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/media:/app/backend/media
      - ./security:/app/security:ro
    command: sh -c "python -m app.scripts.env_check && celery -A app.celery_app.celery_app beat -l info"

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  meilisearch-data:
